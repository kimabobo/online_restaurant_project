{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4 text-center">Додати нову позицію в меню</h2>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Категорія</label>
                    <select name="category" class="form-select" required>
                        <option value="Піца" selected>Піца</option>
                        <option value="Закуски">Закуски</option>
                        <option value="Десерти">Десерти</option>
                        <option value="Напої">Напої</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Назва страви / напою</label>
                    <input type="text" name="name" class="form-control" placeholder="Назва страви" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Короткий опис</label>
                    <textarea name="description" class="form-control" rows="2" placeholder="Опис страви" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Інгредієнти / Склад</label>
                    <input type="text" name="ingredients" class="form-control" placeholder="Склад..." required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Ціна (грн)</label>
                        <input type="number" step="0.1" name="price" class="form-control" placeholder="150.0" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Вага / Об'єм (г або мл)</label>
                        <input type="number" name="weight" class="form-control" placeholder="300" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Посилання на фото</label>
                    <input type="text" name="image" class="form-control" placeholder="https://... URL зображення" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Додати до меню</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
